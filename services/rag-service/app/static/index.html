<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cyber RAG</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 920px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; min-height: 90px; }
    button { padding: 10px 18px; margin-top: 10px; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 16px; }
  </style>
</head>
<body>
  <h1>High Scale Cyber RAG</h1>
  <p>MITRE ATT&CK + CAPEC → FastEmbed → Qdrant</p>
  <textarea id="q" placeholder="Example: What techniques are related to credential access?"></textarea>
  <br>
  <button onclick="ask()">Ask</button>
  <pre id="out"></pre>
  <script>
    async function ask() {
      const q = document.getElementById('q').value;
      const r = await fetch('/query', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: q, top_k: 5, use_llm: true})
      });
      document.getElementById('out').textContent =
        JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
